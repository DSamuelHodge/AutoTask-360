name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build, Test, Lint & Assemble Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run unit tests (debug)
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Run unit tests (release)
        run: ./gradlew testReleaseUnitTest --no-daemon --stacktrace

      - name: Lint (debug)
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Assemble release APK
        # Signing is optional in CI. Provide CI secrets below to sign;
        # otherwise assembly fails on missing keystore. Upload artifact step
        # is skipped unless the APK is produced.
        env:
          # Never echo or log these. They are CI secrets only.
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

  emulator-smoke:
    name: Emulator Smoke (optional)
    needs: build-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Map of the automated smoke checks is in docs/SMOKE_TEST_PLAN.md (#26).
    # Disabled by default to keep CI fast; enable by removing the `if:` guard.
    # Requires AVD image download + KVM; runs the connected-androidTest smoke.
    if: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run emulator smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace
